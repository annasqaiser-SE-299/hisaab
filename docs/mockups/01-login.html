<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 01-login: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; display: flex; flex-direction: column; padding: 72px 24px 32px; gap: 32px">
  <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
    <div style="width: 56px; height: 56px; border-radius: 16px; background: #0E7C6B; display: flex; align-items: center; justify-content: center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Hisaab</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: #5A6B65">Shopping, bills and who-owes-whom for your flat, in one place.</p>
    </div>
  </div>

  <form style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 700">Sign in</h2>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="u" style="font-size: 14px; font-weight: 600">Username</label>
      <input id="u" value="ayesha" style="height: 48px; border-radius: 12px; border: 1px solid #CBD5D1; padding: 0 16px; font-family: inherit; font-size: 16px; color: #10201B; background: #FFFFFF">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="p" style="font-size: 14px; font-weight: 600">Password</label>
      <input id="p" type="password" value="password" style="height: 48px; border-radius: 12px; border: 1px solid #CBD5D1; padding: 0 16px; font-family: inherit; font-size: 16px; color: #10201B; background: #FFFFFF">
    </div>
    <button type="button" style="height: 52px; border-radius: 14px; border: none; background: #0E7C6B; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; margin-top: 8px">Sign in</button>
    <div style="display: flex; gap: 8px; align-items: flex-start; background: #FCEBEC; border-radius: 12px; padding: 12px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B3212A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16v.5"></path></svg>
      <p style="margin: 0; font-size: 14px; line-height: 20px; color: #8E1A22">Example error state: “Wrong username or password.”</p>
    </div>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; align-items: center">
    <p style="margin: 0; font-size: 13px; color: #5A6B65">Demo accounts</p>
    <div style="display: flex; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; background: #E3F3EF; color: #0A5F52; border-radius: 999px; padding: 6px 12px">ali</span>
      <span style="font-size: 13px; font-weight: 600; background: #E3F3EF; color: #0A5F52; border-radius: 999px; padding: 6px 12px">ayesha</span>
      <span style="font-size: 13px; font-weight: 600; background: #E3F3EF; color: #0A5F52; border-radius: 999px; padding: 6px 12px">bilal</span>
    </div>
  </div>
</div>
</body>
</html>
