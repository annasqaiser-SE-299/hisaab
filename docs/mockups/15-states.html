<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading, empty &amp; offline states — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 15-states: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; position: relative; overflow: hidden">
  <div role="status" style="background: #10201B; color: #FFFFFF; padding: 14px 16px; display: flex; align-items: center; gap: 10px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01M3 3l18 18"></path></svg>
    <span style="flex: 1; font-size: 14px; font-weight: 600">Can't reach server. Check Wi-Fi.</span>
    <button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #5A6B65; background: transparent; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 700">Retry</button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 16px 100px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #5A6B65; text-transform: uppercase; letter-spacing: 0.06em">Loading · skeleton cards</h2>
      <div aria-busy="true" style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
        <div style="height: 14px; width: 45%; border-radius: 6px; background: #EEF1EF"></div>
        <div style="height: 30px; width: 70%; border-radius: 8px; background: #EEF1EF"></div>
        <div style="height: 12px; width: 100%; border-radius: 999px; background: #EEF1EF"></div>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 16px; padding: 16px; display: flex; gap: 12px; align-items: center">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: #EEF1EF"></div>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
          <div style="height: 12px; width: 60%; border-radius: 6px; background: #EEF1EF"></div>
          <div style="height: 10px; width: 40%; border-radius: 6px; background: #EEF1EF"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #5A6B65; text-transform: uppercase; letter-spacing: 0.06em">Empty list</h2>
      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 20px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: #E3F3EF; display: flex; align-items: center; justify-content: center">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle></svg>
        </div>
        <span style="font-size: 17px; font-weight: 700">Nothing on the list</span>
        <span style="font-size: 14px; line-height: 20px; color: #5A6B65">Add what the flat needs and tick it off after shopping.</span>
        <button type="button" style="height: 48px; padding: 0 20px; border-radius: 12px; border: none; background: #0E7C6B; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">Add first item</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #5A6B65; text-transform: uppercase; letter-spacing: 0.06em">Button while saving</h2>
      <button type="button" disabled aria-busy="true" style="height: 54px; border-radius: 16px; border: none; background: #0E7C6B; opacity: 0.75; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg>
        Saving…
      </button>
      <div role="status" style="background: #12703A; color: #FFFFFF; border-radius: 14px; padding: 12px 16px; display: flex; align-items: center; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"></path></svg>
        <span style="font-size: 14px; font-weight: 600">Success toast: “Expense saved”</span>
      </div>
    </div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E2E8E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 4px 20px">
    <a href="02-home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6B65; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Home
    </a>
    <a href="03-shopping.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E7C6B; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle></svg>
      Shopping
    </a>
    <a href="05-expenses.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6B65; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      Expenses
    </a>
    <a href="12-activity.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6B65; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Activity
    </a>
  </nav>
</div>
</body>
</html>
