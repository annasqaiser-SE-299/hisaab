<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete confirmation — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 14-delete-confirm: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; position: relative; overflow: hidden">
  <div style="padding: 40px 16px; display: flex; flex-direction: column; gap: 16px" aria-hidden="true">
    <span style="font-size: 26px; font-weight: 800">Expenses</span>
    <div style="height: 240px; border-radius: 20px; background: #FFFFFF"></div>
    <div style="height: 200px; border-radius: 16px; background: #FFFFFF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(16, 32, 27, 0.5)"></div>

  <section role="alertdialog" aria-labelledby="del-title" aria-describedby="del-desc" style="position: absolute; left: 20px; right: 20px; top: 240px; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 16px 40px rgba(16,32,27,0.3)">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: #FCEBEC; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3212A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 id="del-title" style="margin: 0; font-size: 20px; font-weight: 800">Delete “Shopping: Eggs, Bread”?</h1>
      <p id="del-desc" style="margin: 0; font-size: 15px; line-height: 22px; color: #3E4D48">PKR 650.00 will be removed from everyone's balances and this month's spending. Eggs and Bread go back to Pending.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="11-expense-detail.html" style="height: 52px; border-radius: 14px; border: 1px solid #CBD5D1; background: #FFFFFF; color: #10201B; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700">Cancel</a>
      <button type="button" style="height: 52px; border-radius: 14px; border: none; background: #B3212A; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700">Delete</button>
    </div>
  </section>
</div>
</body>
</html>
