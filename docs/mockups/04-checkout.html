<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout sheet — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
input[type=checkbox]{accent-color:#0E7C6B}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 04-checkout: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; position: relative; overflow: hidden">
  <div style="padding: 40px 16px; display: flex; flex-direction: column; gap: 16px" aria-hidden="true">
    <span style="font-size: 26px; font-weight: 800">Shopping list</span>
    <div style="height: 200px; border-radius: 20px; background: #FFFFFF"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(16, 32, 27, 0.45)"></div>

  <section role="dialog" aria-label="Checkout" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 40px; height: 5px; border-radius: 999px; background: #CBD5D1; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Checkout</h1>
      <a href="03-shopping.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="font-size: 13px; font-weight: 600; background: #F3F5F4; border-radius: 999px; padding: 6px 12px">Eggs · 1 dozen</span>
      <span style="font-size: 13px; font-weight: 600; background: #F3F5F4; border-radius: 999px; padding: 6px 12px">Bread · 2 pack</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="total" style="font-size: 14px; font-weight: 600">Total paid (from receipt)</label>
      <div style="display: flex; align-items: center; height: 56px; border-radius: 14px; border: 2px solid #0E7C6B; padding: 0 16px; gap: 8px">
        <span style="font-size: 16px; font-weight: 700; color: #5A6B65">PKR</span>
        <input id="total" value="650.00" inputmode="decimal" style="flex: 1; border: none; outline: none; font-family: inherit; font-size: 22px; font-weight: 800; color: #10201B; font-variant-numeric: tabular-nums; width: 100%">
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Paid by</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px" role="radiogroup" aria-label="Paid by">
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #CBD5D1; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #10201B">Ali</button>
        <button type="button" role="radio" aria-checked="true" style="height: 44px; border-radius: 12px; border: 2px solid #0E7C6B; background: #E3F3EF; font-family: inherit; font-size: 14px; font-weight: 700; color: #0A5F52">Ayesha (you)</button>
        <button type="button" role="radio" aria-checked="false" style="height: 44px; border-radius: 12px; border: 1px solid #CBD5D1; background: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 600; color: #10201B">Bilal</button>
      </div>
    </div>

    <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 14px; font-weight: 600; padding: 0; margin-bottom: 8px">Split equally between</legend>
      <div style="border: 1px solid #E2E8E5; border-radius: 14px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEF1EF">
          <input type="checkbox" id="s1" checked style="width: 22px; height: 22px; margin: 0">
          <label for="s1" style="flex: 1; font-size: 15px; font-weight: 600">Ali</label>
          <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">PKR 216.67</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EEF1EF">
          <input type="checkbox" id="s2" checked style="width: 22px; height: 22px; margin: 0">
          <label for="s2" style="flex: 1; font-size: 15px; font-weight: 600">Ayesha</label>
          <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">PKR 216.67</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
          <input type="checkbox" id="s3" checked style="width: 22px; height: 22px; margin: 0">
          <label for="s3" style="flex: 1; font-size: 15px; font-weight: 600">Bilal</label>
          <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">PKR 216.66</span>
        </div>
      </div>
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #5A6B65">Leftover paisa go to Ali, then Ayesha, so shares add up to exactly PKR 650.00.</p>
    </fieldset>

    <button type="button" style="margin-top: auto; height: 56px; border-radius: 16px; border: none; background: #0E7C6B; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Confirm checkout · PKR 650.00</button>
  </section>
</div>
</body>
</html>
