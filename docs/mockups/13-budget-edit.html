<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edit budget — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 13-budget-edit: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; position: relative; overflow: hidden">
  <div style="padding: 40px 16px; display: flex; flex-direction: column; gap: 16px" aria-hidden="true">
    <div style="height: 44px; width: 160px; border-radius: 999px; background: #FFFFFF"></div>
    <div style="height: 180px; border-radius: 20px; background: #FFFFFF"></div>
    <div style="height: 150px; border-radius: 20px; background: #FCEBEC"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(16, 32, 27, 0.45)"></div>

  <section role="dialog" aria-label="Edit monthly budget" style="position: absolute; left: 0; right: 0; bottom: 0; top: 330px; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="width: 40px; height: 5px; border-radius: 999px; background: #CBD5D1; align-self: center"></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Monthly budget</h1>
      <a href="02-home.html" aria-label="Close" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-right: -10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="b" style="font-size: 14px; font-weight: 600">Household budget per month</label>
      <div style="display: flex; align-items: center; height: 56px; border-radius: 14px; border: 2px solid #0E7C6B; padding: 0 16px; gap: 8px">
        <span style="font-size: 16px; font-weight: 700; color: #5A6B65">PKR</span>
        <input id="b" value="6,000.00" inputmode="decimal" style="flex: 1; border: none; outline: none; font-family: inherit; font-size: 22px; font-weight: 800; color: #10201B; width: 100%; min-width: 0">
      </div>
    </div>
    <div style="background: #F3F5F4; border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: #5A6B65">Preview for November</span>
      <div style="height: 10px; border-radius: 999px; background: #E2E8E5; overflow: hidden">
        <div style="width: 70%; height: 10px; border-radius: 999px; background: #12703A"></div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 13px; font-weight: 700; color: #12703A; background: #E6F4EA; border-radius: 999px; padding: 4px 10px">On Track · 70%</span>
        <span style="font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums">PKR 1,800.00 left</span>
      </div>
    </div>
    <button type="button" style="margin-top: auto; height: 56px; border-radius: 16px; border: none; background: #0E7C6B; color: #FFFFFF; font-family: inherit; font-size: 16px; font-weight: 700">Save budget</button>
  </section>
</div>
</body>
</html>
