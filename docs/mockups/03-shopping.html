<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping list — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
input[type=checkbox]{accent-color:#0E7C6B}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 03-shopping: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F5F4; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; position: relative; overflow: hidden">
  <div style="display: flex; flex-direction: column; gap: 16px; padding: 40px 16px 180px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em">Shopping list</h1>

    <form style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="item" style="font-size: 13px; font-weight: 600; color: #5A6B65">Add item</label>
        <input id="item" placeholder="e.g. Milk" style="height: 48px; border-radius: 12px; border: 1px solid #CBD5D1; padding: 0 14px; font-family: inherit; font-size: 16px; color: #10201B">
      </div>
      <div style="display: flex; gap: 6px" role="group" aria-label="Unit">
        <button type="button" aria-pressed="true" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #0E7C6B; background: #E3F3EF; color: #0A5F52; font-family: inherit; font-size: 13px; font-weight: 700">pack</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #CBD5D1; background: #FFFFFF; color: #10201B; font-family: inherit; font-size: 13px; font-weight: 600">dozen</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #CBD5D1; background: #FFFFFF; color: #10201B; font-family: inherit; font-size: 13px; font-weight: 600">bottle</button>
        <button type="button" aria-pressed="false" style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid #CBD5D1; background: #FFFFFF; color: #10201B; font-family: inherit; font-size: 13px; font-weight: 600">bag</button>
      </div>
      <div style="display: flex; gap: 12px; align-items: center">
        <div style="display: flex; align-items: center; border: 1px solid #CBD5D1; border-radius: 12px; height: 48px">
          <button type="button" aria-label="Decrease quantity" style="width: 44px; height: 46px; border: none; background: transparent; font-size: 20px; color: #10201B">−</button>
          <span style="width: 28px; text-align: center; font-weight: 700; font-size: 16px">1</span>
          <button type="button" aria-label="Increase quantity" style="width: 44px; height: 46px; border: none; background: transparent; font-size: 20px; color: #10201B">+</button>
        </div>
        <button type="button" style="flex: 1; height: 48px; border-radius: 12px; border: none; background: #0E7C6B; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Add to list
        </button>
      </div>
    </form>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Pending · 3</h2>
        <span style="font-size: 13px; color: #5A6B65">Tick what you bought</span>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px; border-bottom: 1px solid #EEF1EF">
          <input type="checkbox" id="i1" checked style="width: 22px; height: 22px; margin: 0">
          <label for="i1" style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">Eggs</span>
            <span style="font-size: 13px; color: #5A6B65">1 dozen · added by Bilal</span>
          </label>
          <span style="font-size: 12px; font-weight: 700; color: #8A4307; background: #FDF1E2; border-radius: 999px; padding: 4px 10px">Pending</span>
          <span style="width: 44px"></span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px; border-bottom: 1px solid #EEF1EF">
          <input type="checkbox" id="i2" checked style="width: 22px; height: 22px; margin: 0">
          <label for="i2" style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">Bread</span>
            <span style="font-size: 13px; color: #5A6B65">2 pack · added by you</span>
          </label>
          <span style="font-size: 12px; font-weight: 700; color: #8A4307; background: #FDF1E2; border-radius: 999px; padding: 4px 10px">Pending</span>
          <button type="button" aria-label="Delete Bread" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
          </button>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 16px">
          <input type="checkbox" id="i3" style="width: 22px; height: 22px; margin: 0">
          <label for="i3" style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600">Cooking Oil</span>
            <span style="font-size: 13px; color: #5A6B65">1 bottle · added by you</span>
          </label>
          <span style="font-size: 12px; font-weight: 700; color: #8A4307; background: #FDF1E2; border-radius: 999px; padding: 4px 10px">Pending</span>
          <button type="button" aria-label="Delete Cooking Oil" style="width: 44px; height: 44px; border: none; background: transparent; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>
          </button>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 16px; font-weight: 700">Bought · 2</h2>
      <div style="background: #FFFFFF; border: 1px solid #E2E8E5; border-radius: 16px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #EEF1EF">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; color: #5A6B65">Milk</span>
            <span style="font-size: 13px; color: #5A6B65">2 bottle</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #0A5F52; background: #E3F3EF; border-radius: 999px; padding: 4px 10px">Bought</span>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px">
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 15px; font-weight: 600; color: #5A6B65">Rice</span>
            <span style="font-size: 13px; color: #5A6B65">1 bag</span>
          </div>
          <span style="font-size: 12px; font-weight: 700; color: #0A5F52; background: #E3F3EF; border-radius: 999px; padding: 4px 10px">Bought</span>
        </div>
      </div>
    </section>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 96px">
    <a href="04-checkout.html" style="height: 56px; border-radius: 16px; background: #10201B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 16px; font-weight: 700">
      <span>Checkout 2 items</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E2E8E5; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 8px 4px 20px">
    <a href="02-home.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6B65; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
      Home
    </a>
    <a href="03-shopping.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #0E7C6B; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0E7C6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="20" r="1.5"></circle><circle cx="17" cy="20" r="1.5"></circle></svg>
      Shopping
    </a>
    <a href="05-expenses.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6B65; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
      Expenses
    </a>
    <a href="12-activity.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #5A6B65; font-size: 12px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5A6B65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Activity
    </a>
  </nav>
</div>
</body>
</html>
