<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duplicate expense warning — Hisaab mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E7C6B}a:hover{color:#0A5F52}
</style>
<style>html{background:#DDE3E0} body{display:flex;justify-content:center}</style>
</head>
<body>
<!-- Mockup 10-duplicate-warning: static reference for the React Native screen. 390x844 phone frame. -->
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #10201B; position: relative; overflow: hidden">
  <div style="padding: 40px 16px; display: flex; flex-direction: column; gap: 16px" aria-hidden="true">
    <span style="font-size: 22px; font-weight: 800">New expense</span>
    <div style="height: 46px; border-radius: 12px; border: 1px solid #CBD5D1"></div>
    <div style="height: 46px; border-radius: 12px; border: 1px solid #CBD5D1"></div>
    <div style="height: 180px; border-radius: 14px; border: 1px solid #E2E8E5"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(16, 32, 27, 0.5)"></div>

  <section role="alertdialog" aria-labelledby="dup-title" aria-describedby="dup-desc" style="position: absolute; left: 20px; right: 20px; top: 220px; background: #FFFFFF; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 16px 40px rgba(16,32,27,0.3)">
    <div style="width: 48px; height: 48px; border-radius: 14px; background: #FDF1E2; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"></path></svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 id="dup-title" style="margin: 0; font-size: 20px; font-weight: 800">Looks like a duplicate</h1>
      <p id="dup-desc" style="margin: 0; font-size: 15px; line-height: 22px; color: #3E4D48">Bilal already logged a similar expense 2 hours ago. Saving again will count it twice.</p>
    </div>
    <div style="background: #F3F5F4; border-radius: 14px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Internet Bill</span>
        <span style="font-size: 13px; color: #5A6B65">Bilal paid · today, 9:12 AM</span>
      </div>
      <span style="font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums">PKR 1,500.00</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <a href="05-expenses.html" style="height: 52px; border-radius: 14px; background: #0E7C6B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Don't save, view existing</a>
      <button type="button" style="height: 48px; border-radius: 14px; border: 1px solid #CBD5D1; background: #FFFFFF; color: #10201B; font-family: inherit; font-size: 15px; font-weight: 700">Save anyway</button>
    </div>
  </section>
</div>
</body>
</html>
